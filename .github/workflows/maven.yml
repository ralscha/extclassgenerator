name: test

on: [push]

jobs:
  test:
    strategy:
      matrix:
        java-version: [17, 21, 25, 26]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up Java ${{ matrix.java-version }}
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java-version }}
    - name: Maven Test
      run: ./mvnw clean test
